<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="EF Assessment Battery">
  <rect width="512" height="512" rx="108" fill="#0f1720"/>
  <!-- Ghost 3×3 grid -->
  <g stroke="#1e2d3d" stroke-width="10" stroke-linecap="round" opacity="0.9">
    <line x1="176" y1="128" x2="176" y2="384"/>
    <line x1="256" y1="128" x2="256" y2="384"/>
    <line x1="336" y1="128" x2="336" y2="384"/>
    <line x1="128" y1="176" x2="384" y2="176"/>
    <line x1="128" y1="256" x2="384" y2="256"/>
    <line x1="128" y1="336" x2="384" y2="336"/>
  </g>
  <!-- Construct links -->
  <g stroke="#0f6b6b" stroke-width="14" stroke-linecap="round" fill="none">
    <path d="M168 320 L256 192"/>
    <path d="M344 320 L256 192"/>
    <path d="M168 320 L344 320"/>
  </g>
  <!-- Three construct nodes: memory / inhibition / flexibility -->
  <circle cx="256" cy="192" r="36" fill="#e8f4f4" stroke="#0f6b6b" stroke-width="10"/>
  <circle cx="168" cy="320" r="36" fill="#0f6b6b"/>
  <circle cx="344" cy="320" r="36" fill="#d4a017"/>
  <!-- Inner dots for readability at small sizes -->
  <circle cx="256" cy="192" r="10" fill="#0f6b6b"/>
  <circle cx="168" cy="320" r="10" fill="#e8f4f4"/>
  <circle cx="344" cy="320" r="10" fill="#0f1720"/>
</svg>
